name: CI and VPS Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: nova-vps-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements_test.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements_test.txt

      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/app/tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/nova_vps_key
          chmod 600 ~/.ssh/nova_vps_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy and restart service
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/nova-signal-router' }}
          VPS_SERVICE_NAME: ${{ vars.VPS_SERVICE_NAME || 'nova-signal-router' }}
          VPS_HEALTH_URL: ${{ vars.VPS_HEALTH_URL || 'http://127.0.0.1:8000/api/health' }}
        run: |
          ssh -i ~/.ssh/nova_vps_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_APP_DIR' && NOVA_APP_DIR='$VPS_APP_DIR' NOVA_SYSTEMD_SERVICE='$VPS_SERVICE_NAME' NOVA_HEALTH_URL='$VPS_HEALTH_URL' bash scripts/deploy_vps.sh '${{ github.sha }}'"
