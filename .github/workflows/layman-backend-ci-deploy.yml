name: Layman backend CI and deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/layman-backend-ci-deploy.yml"
  workflow_dispatch:

concurrency:
  group: layman-nova-vps-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements_test.txt
      - run: pip install -r requirements.txt -r requirements_test.txt
      - run: pytest app/tests -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 20 -H -p 22 187.127.153.128 >> ~/.ssh/known_hosts; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              exit 1
            fi
            sleep 5
          done
          printf 'Host layman-vps\n  HostName 187.127.153.128\n  Port 22\n  User root\n  IdentityFile ~/.ssh/id_ed25519\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' >> ~/.ssh/config
      - name: Deploy isolated Layman backend
        run: ssh layman-vps 'bash /root/layman-nova-signal-router/deploy/deploy_vps.sh'
