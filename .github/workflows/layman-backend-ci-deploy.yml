name: Layman backend CI and deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/layman-backend-ci-deploy.yml"
  workflow_dispatch:
    inputs:
      live_trading_mode:
        description: "Deployment safety mode"
        required: true
        default: "preserve"
        type: choice
        options:
          - preserve
          - safe
          - armed
      live_confirmation:
        description: "For armed mode, type exactly: ARM TWO USER LIVE"
        required: false
        default: ""
        type: string

concurrency:
  group: layman-nova-vps-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements_test.txt
      - run: pip install -r requirements.txt -r requirements_test.txt
      - run: pytest app/tests -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' \
            'layman-vps ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM2zwz7xaJZ46kG6w+BEOFilMdNcEiveSZWxzbaU5OBy' \
            '187.127.153.128 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM2zwz7xaJZ46kG6w+BEOFilMdNcEiveSZWxzbaU5OBy' \
            >> ~/.ssh/known_hosts
          printf 'Host layman-vps\n  HostName 187.127.153.128\n  Port 22\n  User root\n  IdentityFile ~/.ssh/id_ed25519\n  IdentitiesOnly yes\n  BatchMode yes\n  StrictHostKeyChecking yes\n  ConnectTimeout 20\n' >> ~/.ssh/config
      - name: Deploy isolated Layman backend
        timeout-minutes: 8
        # Values come from the protected GitHub "production" environment.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PAYMENT_PROVIDER: ${{ secrets.PAYMENT_PROVIDER }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          RAZORPAY_PLAN_LIVE_MONTHLY: ${{ secrets.RAZORPAY_PLAN_LIVE_MONTHLY }}
          RAZORPAY_PLAN_STATIC_IP_MONTHLY: ${{ secrets.RAZORPAY_PLAN_STATIC_IP_MONTHLY }}
          RAZORPAY_PLAN_STRATEGY_MONTHLY: ${{ secrets.RAZORPAY_PLAN_STRATEGY_MONTHLY }}
          AWS_PROXY_SLOTS_ENABLED: ${{ secrets.AWS_PROXY_SLOTS_ENABLED }}
          AWS_PROXY_HOST: ${{ secrets.AWS_PROXY_HOST }}
          AWS_PROXY_SHARED_PASSWORD: ${{ secrets.AWS_PROXY_SHARED_PASSWORD }}
          AWS_PROXY_SLOT_1_PASSWORD: ${{ secrets.AWS_PROXY_SLOT_1_PASSWORD }}
          AWS_PROXY_SLOT_2_PASSWORD: ${{ secrets.AWS_PROXY_SLOT_2_PASSWORD }}
          AWS_PROXY_SLOT_3_PASSWORD: ${{ secrets.AWS_PROXY_SLOT_3_PASSWORD }}
          AWS_PROXY_SLOT_4_PASSWORD: ${{ secrets.AWS_PROXY_SLOT_4_PASSWORD }}
          AWS_PROXY_SLOT_5_PASSWORD: ${{ secrets.AWS_PROXY_SLOT_5_PASSWORD }}
          DHAN_SHARED_DATA_ENABLED: ${{ secrets.DHAN_SHARED_DATA_ENABLED }}
          DHAN_SHARED_CLIENT_ID: ${{ secrets.DHAN_SHARED_CLIENT_ID }}
          DHAN_SHARED_PIN: ${{ secrets.DHAN_SHARED_PIN }}
          DHAN_SHARED_TOTP_SECRET: ${{ secrets.DHAN_SHARED_TOTP_SECRET }}
          LIVE_TRADING_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.live_trading_mode || 'preserve' }}
          LIVE_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.live_confirmation || '' }}
        run: |
          for required_name in DATABASE_URL GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
            if [ -z "${!required_name}" ]; then
              echo "Missing production environment secret: $required_name" >&2
              exit 1
            fi
          done

          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          chmod 600 "$secrets_file"
          live_trading_armed=preserve
          if [ "$LIVE_TRADING_MODE" = "armed" ]; then
            if [ "$LIVE_CONFIRMATION" != "ARM TWO USER LIVE" ]; then
              echo "Armed deployment requires the exact confirmation phrase." >&2
              exit 1
            fi
            live_trading_armed=true
          elif [ "$LIVE_TRADING_MODE" = "safe" ]; then
            live_trading_armed=false
          fi
          {
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'GOOGLE_CLIENT_ID=%s\n' "$GOOGLE_CLIENT_ID"
            printf 'GOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_SECRET"
            printf 'LIVE_TRADING_ARMED=%s\n' "$live_trading_armed"
            for optional_name in \
              PAYMENT_PROVIDER \
              RAZORPAY_KEY_ID \
              RAZORPAY_KEY_SECRET \
              RAZORPAY_WEBHOOK_SECRET \
              RAZORPAY_PLAN_LIVE_MONTHLY \
              RAZORPAY_PLAN_STATIC_IP_MONTHLY \
              RAZORPAY_PLAN_STRATEGY_MONTHLY \
              AWS_PROXY_SLOTS_ENABLED \
              AWS_PROXY_HOST \
              AWS_PROXY_SHARED_PASSWORD \
              AWS_PROXY_SLOT_1_PASSWORD \
              AWS_PROXY_SLOT_2_PASSWORD \
              AWS_PROXY_SLOT_3_PASSWORD \
              AWS_PROXY_SLOT_4_PASSWORD \
              AWS_PROXY_SLOT_5_PASSWORD \
              DHAN_SHARED_DATA_ENABLED \
              DHAN_SHARED_CLIENT_ID \
              DHAN_SHARED_PIN \
              DHAN_SHARED_TOTP_SECRET
            do
              if [ -n "${!optional_name}" ]; then
                printf '%s=%s\n' "$optional_name" "${!optional_name}"
              fi
            done
          } > "$secrets_file"

          for attempt in 1 2 3 4 5 6; do
            if ssh layman-vps deploy-with-secrets-v1 < "$secrets_file"; then
              exit 0
            fi

            if [ "$attempt" -eq 6 ]; then
              echo "Deployment failed after $attempt SSH attempts." >&2
              exit 1
            fi

            echo "SSH deployment attempt $attempt failed; retrying in 45 seconds." >&2
            sleep 45
          done
