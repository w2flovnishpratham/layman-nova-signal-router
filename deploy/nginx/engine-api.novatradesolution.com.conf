# Engine worker: the single process that owns all singleton background workers
# (Dhan WS, option monitor, EOD square-off, ghost watcher, strategy job worker)
# and every route that executes a trade inline -- manual orders (/api/orders/*)
# and /api/webhook/tradingview both call route_signal() directly and rely on
# paper_portfolio's process-local threading.Lock, so they must never be split
# across processes.
upstream nova_engine {
    server 127.0.0.1:8002;
}

# Webhook-intake worker: a second process of the same app (see
# deploy/layman-nova-signal-intake.service) serving only endpoints that enqueue
# a StrategyExecutionJob and return, without ever calling route_signal().
# The engine's job worker polls every 0.5s (STRATEGY_JOB_WORKER_POLL_SECONDS),
# so it picks up jobs enqueued here without needing a cross-process wake.
#
# The engine is listed as a backup: if the intake unit is down, these requests
# fall through to 8002 instead of 502-ing. Both processes run identical code,
# so that fallback is correct -- just without the isolation benefit.
upstream nova_intake {
    server 127.0.0.1:8102;
    server 127.0.0.1:8002 backup;
}

server {
    listen 80;
    server_name engine-api.novatradesolution.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name engine-api.novatradesolution.com;

    ssl_certificate /etc/letsencrypt/live/engine-api.novatradesolution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/engine-api.novatradesolution.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Intake-only routes -------------------------------------------------
    # Each of these enqueues durable work and returns; none executes a trade in
    # the request. `^~` stops nginx from falling through to the `/` block.
    #
    # Deliberately NOT routed here: /api/webhook/tradingview (and its /webhook
    # alias), which calls route_signal() inline despite sharing this prefix.

    # Shared/published strategy broadcast alerts -- the endpoint whose
    # deliveries were timing out.
    location ^~ /api/webhook/strategy/ {
        proxy_pass http://nova_intake;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Per-user webhook: records an audit row only, never routes an order.
    location ^~ /api/webhook/user/ {
        proxy_pass http://nova_intake;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Private per-instance strategy webhook: enqueues StrategyExecutionJob.
    location = /api/webhooks/private {
        access_log off;
        proxy_pass http://nova_intake;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --- Everything else: UI, API, WebSockets, manual orders, inline-executing
    #     TradingView webhook -------------------------------------------------
    location / {
        proxy_pass http://nova_engine;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
