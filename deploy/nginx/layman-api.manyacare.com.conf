limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=300r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name layman-api.manyacare.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name layman-api.manyacare.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/layman-api.manyacare.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/layman-api.manyacare.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none';" always;

    limit_req_status 429;
    client_max_body_size 1m;

    location ^~ /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        include /etc/nginx/proxy_params;
        proxy_pass http://127.0.0.1:8002;
    }

    location ^~ /webhook/ {
        limit_req zone=webhook_limit burst=20 nodelay;
        include /etc/nginx/proxy_params;
        proxy_pass http://127.0.0.1:8002;
    }

    location ^~ /api/webhook/ {
        limit_req zone=webhook_limit burst=20 nodelay;
        include /etc/nginx/proxy_params;
        proxy_pass http://127.0.0.1:8002;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        limit_req zone=api_limit burst=60 nodelay;
        include /etc/nginx/proxy_params;
        proxy_pass http://127.0.0.1:8002;
    }
}
