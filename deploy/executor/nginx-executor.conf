# Nginx for a single Layman NOVA executor droplet.
#
# Terminates TLS and proxies ONLY the three executor endpoints to the local
# uvicorn (127.0.0.1:8010). Every other path returns 404. Requests are
# restricted to the Hostinger main server IP at the nginx layer; the DigitalOcean
# cloud firewall enforces the same restriction at the network layer (defence in
# depth). See deploy/executor/README.md.
#
# Replace exec-001.example.com and the certificate paths for each droplet.
# Replace HOSTINGER_PUBLIC_IP with the real Hostinger egress IP.

limit_req_zone $binary_remote_addr zone=exec_order_limit:10m rate=30r/m;

server {
    listen 80;
    server_name exec-001.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name exec-001.example.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/exec-001.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exec-001.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none';" always;

    # Allow only the Hostinger main server. Everything else is denied.
    allow HOSTINGER_PUBLIC_IP;
    deny all;

    limit_req_status 429;
    client_max_body_size 16k;

    location = /health {
        include /etc/nginx/proxy_params;
        proxy_pass http://127.0.0.1:8010;
    }

    location = /egress-ip {
        include /etc/nginx/proxy_params;
        proxy_pass http://127.0.0.1:8010;
    }

    location = /execute-order {
        limit_req zone=exec_order_limit burst=5 nodelay;
        include /etc/nginx/proxy_params;
        proxy_pass http://127.0.0.1:8010;
    }

    location / {
        return 404;
    }
}
